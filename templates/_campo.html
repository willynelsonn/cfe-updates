<div class="campo {% if campo.errors %}tem-erro{% endif %}">
  {% if campo.field.widget.input_type == "checkbox" %}
    <label>{{ campo }} {{ campo.label|capfirst }}</label>
  {% else %}
    <label for="{{ campo.id_for_label }}">{{ campo.label|capfirst }}{% if campo.field.required %} <span aria-hidden="true" class="muted">*</span>{% endif %}</label>
    {{ campo }}
  {% endif %}
  {% if campo.help_text %}<div class="ajuda">{{ campo.help_text }}</div>{% endif %}
  {% for e in campo.errors %}<div class="erro">{{ e }}</div>{% endfor %}
</div>
