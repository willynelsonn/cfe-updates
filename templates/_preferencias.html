<div class="rotulo-pop" id="rot-cor">Cor do sistema</div>
<div class="paleta" role="group" aria-labelledby="rot-cor">
  <button type="button" data-cor="laranja" style="--amostra:linear-gradient(135deg,#f37a4a,#c2410c)" title="Laranja" aria-label="Laranja"></button>
  <button type="button" data-cor="azul" style="--amostra:linear-gradient(135deg,#5598e7,#1c5cab)" title="Azul" aria-label="Azul"></button>
  <button type="button" data-cor="verde" style="--amostra:linear-gradient(135deg,#34c792,#047857)" title="Verde" aria-label="Verde"></button>
  <button type="button" data-cor="roxo" style="--amostra:linear-gradient(135deg,#8577e8,#4a3aa7)" title="Roxo" aria-label="Roxo"></button>
  <button type="button" data-cor="rosa" style="--amostra:linear-gradient(135deg,#e87ba4,#a8215a)" title="Rosa" aria-label="Rosa"></button>
  <button type="button" data-cor="grafite" style="--amostra:linear-gradient(135deg,#6b6b74,#18181b)" title="Grafite" aria-label="Grafite"></button>
</div>
<div class="rotulo-pop" id="rot-aparencia">Aparência</div>
<div class="segmentado" role="group" aria-labelledby="rot-aparencia">
  <button type="button" data-aparencia="light">Claro</button>
  <button type="button" data-aparencia="dark">Escuro</button>
  <button type="button" data-aparencia="auto">Automático</button>
</div>
